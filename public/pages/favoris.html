<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where is it ?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

        <a class="navbar-brand" href="../index.html" aria-label="WIT, Where is it ?">
          <svg class="pin" viewBox="0 0 24 30" width="30" height="35" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20 12 30 12 30s12-10 12-18.3C24 5.2 18.6 0 12 0z" fill="#38D9B4"/><circle cx="12" cy="11.5" r="4.5" fill="#1E2468"/></svg>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"

        <div class="collapse navbar-collapse" id="menu">

          <div class="d-flex align-items-center gap-3">
            <div class="d-flex gap-2" role="group" aria-label="Langue" data-i18n-aria="lang.label">
              <button type="button" class="btn-flag" data-lang="fr" lang="fr" aria-label="Français" aria-pressed="true">
                <svg viewBox="0 0 3 2" width="24" height="16" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>FR
              </button>
              <button type="button" class="btn-flag" data-lang="en" lang="en" aria-label="English" aria-pressed="false">
                <svg viewBox="0 0 60 30" width="26" height="13" aria-hidden="true"><clipPath id="uk"><path d="M30 15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30M60 0L0 30" clip-path="url(#uk)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg>EN

          </div>
        </div>

    <div class="d-flex flex-wrap justify-content-between align-items-baseline mt-3 mb-4">

      <p id="favCount" class="text-muted mb-0" role="status" aria-live="polite"></p>
    </div>

    <div id="favResults" class="row g-4"></div>

    <div id="favEmpty" class="auth-card text-center mx-auto d-none" style="max-width:520px">
      <h2 class="h4" data-i18n="fav.empty">Tu n’as pas encore de favori.</h2>
      <p class="text-muted" data-i18n="fav.empty.hint">Appuie sur le cœur d’une annonce pour la retrouver ici.</p>
      <a class="btn btn-ink" href="../index.html" data-i18n="fav.back">Chercher des objets</a>
    </div>

  <footer class="py-4">
    <div class="container small" data-i18n="footer">Un projet d’étudiant, fait avec soin.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
